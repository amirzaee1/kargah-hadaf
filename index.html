<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کارگاه هدف</title>
<meta name="description" content="کارگاه تعاملی هدف‌گذاری با راوی — فانوسِ خودت، موتورِ شخصیتت، قانون‌های هدف و قراردادِ هدفِ من">
<meta name="theme-color" content="#0f0b08">
<link rel="icon" href="data:,">
<style>
@font-face { font-family: Vazirmatn; src: url(fonts/Vazirmatn-Regular.ttf); font-weight: 400; font-display: swap; }
@font-face { font-family: Vazirmatn; src: url(fonts/Vazirmatn-SemiBold.ttf); font-weight: 600; font-display: swap; }
@font-face { font-family: Vazirmatn; src: url(fonts/Vazirmatn-Bold.ttf); font-weight: 700; font-display: swap; }
@font-face { font-family: Vazirmatn; src: url(fonts/Vazirmatn-Black.ttf); font-weight: 900; font-display: swap; }
@font-face { font-family: Lalezar; src: url(fonts/Lalezar-Regular.ttf); font-display: swap; }
:root {
  --bg: #0f0b08; --bg2: #1a130e; --panel: rgba(30, 22, 16, .74); --panel2: rgba(46, 34, 24, .82);
  --line: rgba(226, 178, 96, .26); --gold: #E2B260; --gold2: #F4D493; --copper: #C98A4B;
  --cream: #F6EDE1; --muted: #BFAE97; --dim: rgba(246, 237, 225, .42);
  --ease: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.34, 1.42, .5, 1);
  --top: calc(56px + env(safe-area-inset-top, 0px)); --bottom: 74px;
  /* the film column. Its own status line (top 100 of 1920) stays behind the site's bar, and the bare floor under the disc may run under the controls: 1764 of 1920 must fit */
  --fw: min(100vw, calc((100vh - var(--top)) * .6122)); --ph: calc(var(--fw) * 16 / 9);
  --below: calc(var(--top) + var(--fw) * 550 / 1080);  /* film y = 650: under his chin; nothing opens higher than this */
}
@supports (height: 100dvh) { :root { --fw: min(100vw, calc((100dvh - var(--top)) * .6122)); } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); overflow: hidden; }
body { font-family: Vazirmatn, Tahoma, sans-serif; font-size: 16px; line-height: 1.75; }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-family: Lalezar, Vazirmatn, sans-serif; }

/* ===== stage ===== */
#stage { position: fixed; inset: 0; overflow: hidden; background: #070503; }


/* ambient backdrop behind the board: the same study, blurred and dimmed, slowly drifting, with gold dust */
#amb { display: none; position: absolute; inset: -8%; z-index: 1; background: url(media/base.jpg) center 30% / cover; filter: blur(26px) brightness(.32) saturate(1.2);
  animation: drift 28s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1.1) translate(-2%, -1%); } to { transform: scale(1.22) translate(2%, 1.5%); } }
#dust { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

/* the film: the whole frame. While he waits, his idle loop stands behind it in the same place and pose */
#pres { position: absolute; z-index: 5; top: calc(var(--top) - var(--fw) * 100 / 1080); right: calc(50% - var(--fw) / 2); width: var(--fw); height: var(--ph); overflow: hidden; background: #070503; transition: right .7s var(--ease); }
#pres video, #pres img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#film { transition: opacity .3s ease; }
#pres.still #film { opacity: 0; }
body.boot #ctl, body.boot #top button { visibility: hidden; }
#spin { position: absolute; left: 50%; top: 88%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2.5px solid rgba(226,178,96,.25); border-top-color: var(--gold2); opacity: 0; transition: opacity .2s; pointer-events: none; animation: spin .9s linear infinite; }
#spin.on { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
#note { position: absolute; left: 8%; right: 8%; top: 82%; padding: 8px 12px; text-align: center; font-weight: 700; font-size: 14px; background: rgba(15,11,8,.86); border: 1px solid var(--line); border-radius: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#note.on { opacity: 1; }

/* board: only the chapter's medal now, under his chin */
#board { position: absolute; z-index: 8; inset: var(--below) 14px var(--bottom) 14px; pointer-events: none; display: flex; align-items: center; justify-content: center; }
body.talk #board { opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
body.show #board { opacity: 1; visibility: visible; transition: opacity .3s .15s; }
#board > .beat { pointer-events: auto; width: 100%; max-width: 640px; transform-origin: 50% 50%; }
#board > .beat.out { position: absolute; animation: beatOut .35s var(--ease) forwards; }
@keyframes beatOut { to { opacity: 0; transform: translateY(-14px) scale(.97); filter: blur(6px); } }

/* top bar */
#top { position: absolute; z-index: 20; top: 0; left: 0; right: 0; height: var(--top); display: flex; align-items: center; gap: 10px; padding: env(safe-area-inset-top, 0px) 12px 0;
  background: #0f0b08; border-bottom: 1px solid rgba(226,178,96,.18); }
#top .brand { font-weight: 900; font-size: 15px; white-space: nowrap; }
#top .brand b { color: var(--gold); }
#segs { flex: 1; display: flex; gap: 4px; direction: rtl; }
#segs i { flex: 1; height: 3px; border-radius: 3px; background: rgba(246,237,225,.22); overflow: hidden; position: relative; }
#segs i::after { content: ""; position: absolute; inset: 0; background: var(--gold); transform-origin: right; transform: scaleX(var(--p, 0)); transition: transform .3s linear; }
.ib { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: rgba(15,11,8,.5); display: grid; place-items: center; backdrop-filter: blur(8px); }
.ib svg { width: 20px; height: 20px; }
.ib.txt { width: auto; padding: 0 10px; font-size: 13px; font-weight: 700; }

/* bottom controls */
#ctl { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; height: var(--bottom); padding: 0 14px max(10px, env(safe-area-inset-bottom));
  display: flex; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(0deg, rgba(15,11,8,.92), rgba(15,11,8,0)); }
#ctl .ib { width: 46px; height: 46px; border-radius: 15px; }
#next { height: 46px; padding: 0 22px; border-radius: 15px; border: 0; background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #24170c; font-weight: 900; display: flex; align-items: center; gap: 8px; }
#next svg { width: 18px; height: 18px; }
#next.wait, #pp.wait { animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(226,178,96,.55); } 50% { box-shadow: 0 0 0 12px rgba(226,178,96,0); } }
/* auto-next countdown 5..1 (only after the scene's interaction is answered or skipped) */
#next { position: relative; overflow: hidden; }
#next .cdn { display: none; width: 26px; height: 26px; border-radius: 50%; place-items: center; background: #24170c; color: var(--gold2);
  font-family: Lalezar, Vazirmatn; font-weight: 400; font-size: 17px; line-height: 1; }
#next.cd .cdn { display: grid; animation: cdPop .45s var(--spring); }
#next::after { content: ""; position: absolute; right: 0; bottom: 0; height: 4px; width: 100%; background: rgba(36,23,12,.45);
  transform-origin: right; transform: scaleX(0); }
#next.cd::after { transform: scaleX(var(--cd, 0)); transition: transform 1s linear; }
@keyframes cdPop { from { transform: scale(.4); opacity: 0; } }

/* ===== beats ===== */
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.badge { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; color: #24170c; position: relative;
  background: radial-gradient(circle at 30% 25%, var(--gold2), var(--gold) 55%, var(--copper)); box-shadow: 0 10px 30px rgba(226,178,96,.35); }
.badge svg { width: 34px; height: 34px; }
.ico { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; color: var(--gold); background: rgba(226,178,96,.1); border: 1px solid var(--line); }
.ico svg { width: 25px; height: 25px; }
.in { animation: rise .7s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.96); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
.pop { animation: pop .6s var(--spring) both; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

/* hero */
.hero { text-align: center; padding: 26px 22px 24px; position: relative; overflow: hidden; }
.hero .badge { margin: 0 auto 14px; width: 78px; height: 78px; border-radius: 24px; }
.hero .badge svg { width: 40px; height: 40px; }
.hero .ring { position: absolute; left: 50%; top: 64px; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 1px dashed rgba(226,178,96,.45); animation: spin 18s linear infinite; }
.hero .ring::before { content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--gold2); box-shadow: 0 0 12px var(--gold); }
@keyframes spin { to { transform: rotate(360deg); } }
.hero h3 { margin: 0; font-family: Lalezar, Vazirmatn; font-weight: 400; font-size: 42px; line-height: 1.25; color: var(--gold2); }
.hero p { margin: 6px 0 0; font-size: 19px; font-weight: 700; }

/* quote */
.quote { padding: 6px 4px; text-align: center; }
.quote .badge { margin: 0 auto 12px; width: 54px; height: 54px; border-radius: 17px; }
.quote .badge svg { width: 28px; height: 28px; }
.quote blockquote { margin: 0; font-family: Lalezar, Vazirmatn; font-size: 34px; line-height: 1.45; text-shadow: 0 4px 24px rgba(0,0,0,.8); }
.quote .q { display: inline-block; opacity: 0; transform: translateY(16px); filter: blur(6px); margin: 0 .12em; }
.quote .q.on { animation: qw .45s var(--ease) forwards; }
.quote .q.hl { color: var(--gold2); }
.quote .q.hl.on { animation: qw .45s var(--ease) forwards, punch .5s var(--spring) forwards; }
@keyframes qw { to { opacity: 1; transform: none; filter: none; } }
@keyframes punch { 0% { scale: 1; } 40% { scale: 1.22; } 100% { scale: 1; } }
.quote .rule { width: 0; height: 2px; margin: 14px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: grow 1.2s .4s var(--ease) forwards; }
@keyframes grow { to { width: 70%; } }

/* cards */
.cards { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 10px; }
.card { padding: 12px; display: flex; gap: 10px; align-items: center; transition: transform .45s var(--spring), opacity .4s, border-color .4s, box-shadow .4s; position: relative; overflow: hidden; }
.card .t { font-weight: 800; font-size: 15.5px; line-height: 1.5; }
.card .s { font-size: 13px; color: var(--muted); line-height: 1.6; }
.card.ghost { opacity: .18; filter: grayscale(1); }
.cards.focus .card:not(.hi):not(.ghost) { opacity: .5; }
.card.hi { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 14px 40px rgba(226,178,96,.22); transform: translateY(-3px) scale(1.02); }
.card.hi::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(244,212,147,.25) 50%, transparent 70%); transform: translateX(120%); animation: sheen 1.4s .1s var(--ease); }
@keyframes sheen { to { transform: translateX(-120%); } }
.cards.stamp .card .t { position: relative; }
.cards.stamp .card .t::after { content: ""; position: absolute; right: -2px; left: -2px; top: 52%; height: 2.5px; background: var(--gold); transform-origin: right; transform: scaleX(0); animation: strike .45s .35s var(--ease) forwards; }
@keyframes strike { to { transform: scaleX(1); } }
.cards.stamp .card { opacity: .9; }
.cards.locked .card::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(226,178,96,.07) 0 8px, transparent 8px 16px); }
.cards.orbit { --cols: 1; gap: 7px; position: relative; padding-right: 18px; }
.cards.orbit::before { content: ""; position: absolute; right: 6px; top: 22px; bottom: 22px; width: 2px; background: linear-gradient(var(--gold), rgba(226,178,96,.1)); border-radius: 2px; }
.cards.orbit .card { padding: 9px 12px; }
.cards.orbit .card::before { content: ""; position: absolute; right: -16px; top: 50%; }
.cards.orbit .ico { width: 38px; height: 38px; border-radius: 12px; }
.cards.pillars .card { flex-direction: column; text-align: center; padding: 18px 10px 16px; gap: 8px; }

/* chain */
.chain { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.step { display: flex; align-items: center; gap: 12px; padding: 11px 14px; transition: opacity .4s, border-color .4s, box-shadow .4s, transform .45s var(--spring); }
.step .t { font-weight: 800; font-size: 17px; }
.step.ghost { opacity: .15; }
.step.hi { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 12px 34px rgba(226,178,96,.2); transform: scale(1.03); }
.chain.focus .step:not(.hi):not(.ghost) { opacity: .55; }
.link { height: 24px; position: relative; display: grid; place-items: center; }
.link::before { content: ""; width: 2px; height: 100%; background: linear-gradient(var(--gold), rgba(226,178,96,.25)); }
.link::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--gold2); box-shadow: 0 0 10px var(--gold); animation: travel 1.6s linear infinite; }
.link.ghost { opacity: .15; }
/* fitBeat: a beat still small after being laid out wider drops its paddings and the second line of the rows not being spoken */
.beat.tight .step { padding: 6px 10px; gap: 9px; }
.beat.tight .step .ico { width: 30px; height: 30px; border-radius: 10px; }
.beat.tight .link { height: 10px; }
.beat.tight .step:not(.hi) .s, .beat.tight .row:not(.hi) .s { display: none; }
.beat.tight .list { padding: 8px; gap: 4px; }
.beat.tight .row { padding: 5px 9px; }
.beat.tight .row .n { width: 24px; height: 24px; font-size: 14px; }
@keyframes travel { from { top: 0; } to { top: calc(100% - 7px); } }

/* versus */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.side { padding: 16px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: opacity .45s, transform .5s var(--spring), border-color .4s, box-shadow .4s; }
.side .t { font-weight: 900; font-size: 18px; line-height: 1.4; }
.side .s { font-size: 13px; color: var(--muted); line-height: 1.6; }
.side.dim { opacity: .38; transform: scale(.94); filter: saturate(.3); }
.side.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 14px 40px rgba(226,178,96,.25); transform: scale(1.04); }
.vs .mid { display: grid; place-items: center; font-family: Lalezar; color: var(--gold); font-size: 22px; }
.vs .mid span { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--bg2); animation: glow 2.2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 22px rgba(226,178,96,.45); } }

/* stat */
.stat { text-align: center; padding: 18px 16px 20px; position: relative; overflow: hidden; }
.stat svg.arc { width: 190px; height: 190px; display: block; margin: 0 auto; }
.stat .val { position: absolute; left: 0; right: 0; top: 70px; font-family: Lalezar; font-size: 54px; line-height: 1; color: var(--gold2); direction: rtl; }
.stat .val small { font-size: 22px; margin-right: 4px; color: var(--cream); }
.stat .val.rng { font-size: 36px; top: 78px; } .stat .val.rng small { font-size: 15px; }  /* «۶۰ تا ۹۰ دقیقه» must fit inside the ring, not run over it */
.stat .lb { margin-top: 6px; font-weight: 800; font-size: 17px; }
.stat .ic2 { position: absolute; left: 0; right: 0; top: 36px; display: grid; place-items: center; color: var(--gold); opacity: .8; }
.stat .ic2 svg { width: 24px; height: 24px; }

/* list */
.list { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 11px; border-radius: 14px; background: rgba(246,237,225,.04); border: 1px solid transparent; transition: all .45s var(--ease); }
.row .n { width: 30px; height: 30px; flex: none; border-radius: 10px; display: grid; place-items: center; font-family: Lalezar; font-size: 17px; background: rgba(226,178,96,.14); color: var(--gold2); }
.row .t { font-weight: 700; font-size: 15px; line-height: 1.6; }
.row .s { font-size: 12.5px; color: var(--muted); }
.row.ghost { opacity: .16; border-style: dashed; border-color: var(--line); }
.row.hi { border-color: var(--gold); background: rgba(226,178,96,.1); transform: translateX(-4px); }

/* chart */
.chart { padding: 14px 12px 10px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .lg { display: flex; gap: 16px; justify-content: center; font-size: 13.5px; font-weight: 700; margin-top: 4px; }
.chart .lg i { display: inline-block; width: 18px; height: 3px; border-radius: 3px; vertical-align: middle; margin-left: 6px; }
.draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.6s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* people grid */
.dots { padding: 16px; text-align: center; }
.dots .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; direction: ltr; max-width: 250px; margin: 0 auto; }
.dots .p { aspect-ratio: 1; color: rgba(246,237,225,.33); opacity: 0; animation: pop .4s var(--spring) forwards; }
.dots .p svg { width: 100%; height: 100%; display: block; }
.dots .p.g { color: var(--gold2); filter: drop-shadow(0 0 6px var(--gold)); }
.dots.two .p:not(.g) { color: rgba(246,237,225,.18); }
.dots .lb { margin-top: 12px; font-weight: 800; font-size: 16px; }
.dots .lb b { font-family: Lalezar; font-weight: 400; font-size: 30px; color: var(--gold2); margin-left: 6px; }

/* funnel */
.funnel { padding: 14px 10px 10px; }
.funnel svg { width: 100%; display: block; overflow: visible; }
.funnel .drop { animation: fall 1.8s linear infinite; }
@keyframes fall { from { transform: translateY(-6px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(95px); opacity: 0; } }

/* chess */
.chess { padding: 14px; text-align: center; }
.chess .bd { display: grid; grid-template-columns: repeat(8, 1fr); width: min(100%, 300px); margin: 0 auto; border-radius: 10px; overflow: hidden; border: 2px solid rgba(226,178,96,.5); direction: ltr; }
.chess .sq { aspect-ratio: 1; display: grid; place-items: center; font-size: 11px; font-weight: 900; transition: background .25s, transform .25s; opacity: 0; animation: pop .35s var(--spring) forwards; }
.chess .sq.l { background: #d9c3a0; color: #3a2a1a; } .chess .sq.d { background: #7a5535; color: #f6edd8; }
.chess .sq.gold { background: radial-gradient(circle, var(--gold2), var(--gold)); color: #24170c; box-shadow: inset 0 0 0 2px #fff6; animation: pop .35s var(--spring) forwards, glow 1.6s ease-in-out infinite; }
.chess .sq.hit { background: rgba(226,178,96,.9) !important; transform: scale(.86); border-radius: 4px; }
.chess .sq svg { width: 70%; height: 70%; }
.chess .lb { margin-top: 10px; font-weight: 800; }
.chess .lb b { color: var(--gold2); font-family: Lalezar; font-weight: 400; font-size: 22px; }

/* chat */
.phone { padding: 0; overflow: hidden; max-width: 420px; margin: 0 auto; }
.phone .hd { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: rgba(246,237,225,.04); }
.phone .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--copper), var(--gold)); color: #24170c; font-weight: 900; }
.phone .nm { font-weight: 800; font-size: 14.5px; line-height: 1.3; } .phone .st { font-size: 11.5px; color: var(--gold); }
.phone .bd { padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.msg { max-width: 86%; padding: 9px 12px; border-radius: 16px; font-size: 14.5px; line-height: 1.75; animation: rise .5s var(--ease) both; }
.msg.me { align-self: flex-start; background: linear-gradient(180deg, #4a3522, #3a2919); border: 1px solid rgba(226,178,96,.35); border-top-right-radius: 5px; }
.msg.you { align-self: flex-end; background: rgba(246,237,225,.92); color: #24170c; border-top-left-radius: 5px; font-weight: 700; }
.msg.nt { align-self: center; font-size: 12px; color: var(--gold); background: rgba(226,178,96,.1); padding: 3px 12px; border-radius: 99px; }
.typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; border-radius: 16px; background: #3a2919; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: wv .9s infinite; }
.typing i:nth-child(2) { animation-delay: .15s } .typing i:nth-child(3) { animation-delay: .3s }

/* achievement */
.achieve { text-align: center; padding: 26px 20px; position: relative; overflow: hidden; }
.medal { width: 112px; height: 112px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; font-family: Lalezar; font-size: 46px; color: #24170c;
  background: conic-gradient(from 0deg, var(--gold2), var(--copper), var(--gold2), var(--gold), var(--gold2)); box-shadow: 0 0 0 6px rgba(226,178,96,.18), 0 18px 50px rgba(226,178,96,.35); animation: pop .8s var(--spring) both; }
.achieve h3 { margin: 0; font-family: Lalezar; font-weight: 400; font-size: 30px; color: var(--gold2); }
.achieve p { margin: 8px 0 0; font-weight: 700; }
.spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--gold2); box-shadow: 0 0 10px var(--gold); animation: sparkle 2.4s ease-out infinite; }
@keyframes sparkle { 0% { transform: translate(0,0) scale(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }

/* ===== «هنر گفت‌وگو» beats ===== */
:root { --rust: #E07A5F; --rust2: rgba(224,122,95,.14); }
/* entrance variety: every new beat comes in its own way (translate/scale props, so the fit transform is untouched) */
#board > .beat.e1 { animation: inSlide .6s var(--ease) both; }
#board > .beat.e2 { animation: inZoom .65s var(--spring) both; }
#board > .beat.e3 { animation: inWipe .75s var(--ease) both; }
@keyframes inSlide { from { opacity: 0; translate: 46px 0; filter: blur(8px); } }
@keyframes inZoom { from { opacity: 0; scale: .82; filter: blur(6px); } }
@keyframes inWipe { from { clip-path: inset(0 0 0 100%); opacity: .3; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
.step .s { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* five triggers: the prospect's mind as a column of five triggers, each one "clicks" */
.trig { padding: 12px 12px 14px; position: relative; overflow: hidden; }
.trig .th { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 14px; color: var(--gold); margin: 0 4px 8px; }
.trig .th svg { width: 20px; height: 20px; }
.trig .rail { position: absolute; right: 37px; top: 52px; bottom: 58px; width: 2px; background: linear-gradient(var(--gold), rgba(226,178,96,.08)); }
.trig .rail::after { content: ""; position: absolute; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold2); box-shadow: 0 0 12px var(--gold); animation: travel 2.2s linear infinite; }
.tq { display: flex; align-items: center; gap: 11px; padding: 7px 8px; border-radius: 15px; border: 1px solid transparent; position: relative; transition: all .45s var(--ease); }
.tq .tn { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: Lalezar; font-size: 19px; color: #24170c; z-index: 1;
  background: radial-gradient(circle at 30% 25%, var(--gold2), var(--gold) 60%, var(--copper)); box-shadow: 0 0 0 4px rgba(15,11,8,.85); }
.tq .tt { flex: 1; min-width: 0; } .tq .tt b { display: block; font-weight: 900; font-size: 16px; line-height: 1.5; } .tq .tt span { font-size: 12.5px; color: var(--muted); }
.tq .tz { width: 30px; height: 30px; color: var(--gold); opacity: .7; } .tq .tz svg { width: 100%; height: 100%; }
.tq.ghost { opacity: .14; } .tq.blind .tt { filter: blur(7px); opacity: .5; }
.tq.hi { background: rgba(226,178,96,.11); border-color: var(--gold); box-shadow: 0 10px 30px rgba(226,178,96,.18); transform: translateX(-5px); }
.trig.focus .tq:not(.hi):not(.ghost) { opacity: .45; }
.tq.fire .tn { animation: fire .55s var(--spring); }
@keyframes fire { 0% { transform: scale(1); } 30% { transform: scale(1.45); box-shadow: 0 0 0 4px rgba(15,11,8,.85), 0 0 26px 8px rgba(244,212,147,.75); } 100% { transform: scale(1); } }
.trig .gate { margin: 10px 4px 0; padding: 9px; border-radius: 14px; text-align: center; font-weight: 900; border: 1px dashed var(--line); color: var(--dim); transition: all .5s var(--ease); }
.trig .gate.on { border-style: solid; border-color: var(--gold); color: #24170c; background: linear-gradient(180deg, var(--gold2), var(--gold)); box-shadow: 0 12px 36px rgba(226,178,96,.35); }

/* donut: share of each trigger in the decision */
.donut { padding: 16px 14px 14px; display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center; }
.donut .dw { position: relative; width: 170px; height: 170px; }
.donut svg { width: 170px; height: 170px; transform: rotate(-90deg); overflow: visible; }
.donut .sg { fill: none; stroke-width: 24; transition: stroke-dasharray 1.1s var(--ease), opacity .4s, stroke-width .4s; }
.donut.focus .sg:not(.hi) { opacity: .28; } .donut .sg.hi { stroke-width: 30; }
.donut .ctr { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.donut .ctr b { font-family: Lalezar; font-weight: 400; font-size: 46px; line-height: 1; color: var(--gold2); display: block; }
.donut .ctr span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.donut .lgd { display: flex; flex-direction: column; gap: 7px; }
.donut .li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; transition: all .4s var(--ease); }
.donut .li i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.donut .li .t { font-weight: 800; font-size: 14px; line-height: 1.35; } .donut .li .s { font-size: 11.5px; color: var(--muted); }
.donut .li .p { margin-inline-start: auto; font-family: Lalezar; font-size: 20px; color: var(--gold2); }
.donut .li.ghost { opacity: .15; } .donut .li.hi { background: rgba(226,178,96,.12); }

/* four subconscious filters: your words fall through four membranes */
.filt { padding: 14px 14px 12px; position: relative; overflow: hidden; }
.filt .bub { position: relative; z-index: 2; margin: 0 auto 10px 6px; width: max-content; display: flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 99px;
  background: linear-gradient(180deg, #4a3522, #3a2919); border: 1px solid rgba(226,178,96,.5); font-weight: 800; font-size: 14px; transition: translate 1s var(--ease); }
.filt .bub svg { width: 18px; height: 18px; color: var(--gold); }
.filt .bub.shake { animation: shake .5s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.fl { position: relative; margin: 7px 0; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; gap: 10px; transition: all .45s var(--ease); }
.fl::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(226,178,96,.13) 0 2px, transparent 2px 9px); opacity: .6; }
.fl .k { position: relative; font-family: Lalezar; font-size: 18px; color: var(--gold); width: 22px; text-align: center; }
.fl b { position: relative; font-weight: 800; font-size: 15px; }
.fl.ghost { opacity: .14; } .fl.hi { border-color: var(--gold); background: rgba(226,178,96,.1); box-shadow: 0 0 0 1px var(--gold), 0 10px 30px rgba(226,178,96,.2); }
.fl.red { border-color: var(--rust); background: var(--rust2); box-shadow: 0 0 0 1px var(--rust), 0 0 30px rgba(224,122,95,.25); } .fl.red .k { color: var(--rust); }
.filt .fo { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
.filt .fo span { padding: 6px 18px; border-radius: 12px; font-weight: 900; border: 1px dashed var(--line); color: var(--dim); transition: all .4s var(--ease); }
.filt .fo .no.on { color: #fff; background: var(--rust); border: 1px solid var(--rust); box-shadow: 0 0 26px rgba(224,122,95,.5); animation: pop .5s var(--spring); }
.filt .fo .yes.on { color: #24170c; background: var(--gold); border: 1px solid var(--gold); animation: pop .5s var(--spring); }

/* the seller alarm: a red button in the prospect's head */
.alarm { padding: 20px 16px 16px; text-align: center; position: relative; overflow: hidden; }
.alarm .siren { position: relative; width: 120px; height: 120px; margin: 0 auto 10px; display: grid; place-items: center; }
.alarm .siren i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--rust); opacity: 0; }
.alarm.on .siren i { animation: ripple 1.6s ease-out infinite; } .alarm.on .siren i + i { animation-delay: .8s; }
@keyframes ripple { from { transform: scale(.55); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.alarm .knob { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; color: rgba(246,237,225,.5); transition: all .5s var(--ease);
  background: radial-gradient(circle at 35% 30%, #5a4a3c, #2a2017); box-shadow: inset 0 -6px 12px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.5); }
.alarm .knob svg { width: 36px; height: 36px; }
.alarm.on .knob { color: #fff; background: radial-gradient(circle at 35% 30%, #F2A48C, var(--rust) 55%, #8f3a26); box-shadow: inset 0 -6px 12px rgba(0,0,0,.35), 0 0 40px rgba(224,122,95,.65); animation: glowR 1.2s ease-in-out infinite; }
@keyframes glowR { 50% { box-shadow: inset 0 -6px 12px rgba(0,0,0,.35), 0 0 60px rgba(224,122,95,.9); } }
.alarm .al { font-weight: 900; font-size: 18px; } .alarm.on .al b { color: var(--rust); } .alarm:not(.on) .al b { color: var(--gold2); }
.alarm .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.alarm .chips2 { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
.alarm .chips2 span { padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 700; background: var(--rust2); border: 1px solid rgba(224,122,95,.4); transition: all .4s var(--ease); }
.alarm .chips2 span.ghost { opacity: .12; }

/* iceberg: information and logic on the surface, the decision under water */
.berg { padding: 10px 10px 8px; }
.berg svg { width: 100%; display: block; overflow: visible; }
.berg .lbl { transition: opacity .5s; } .berg .x { opacity: 0; transition: opacity .4s; } .berg .x.on { opacity: 1; }
.berg .deep { transition: opacity .8s; opacity: .35; } .berg .deep.on { opacity: 1; }
.berg .wv { animation: wave 5s ease-in-out infinite alternate; }
@keyframes wave { to { transform: translateX(-24px); } }

/* nods: two small yeses build the road to agreement */
.nods { padding: 18px 14px 16px; text-align: center; }
.nods .row3 { display: flex; justify-content: center; align-items: center; gap: 10px; }
.nods .nd { width: 92px; padding: 12px 6px 10px; border-radius: 18px; border: 1px dashed var(--line); opacity: .3; transition: all .5s var(--ease); }
.nods .nd svg { width: 38px; height: 38px; color: var(--gold2); display: block; margin: 0 auto 4px; }
.nods .nd b { font-weight: 900; font-size: 14px; }
.nods .nd.on { opacity: 1; border: 1px solid var(--gold); background: rgba(226,178,96,.1); box-shadow: 0 12px 30px rgba(226,178,96,.2); }
.nods .nd.on svg { animation: nod .9s ease-in-out 2; }
@keyframes nod { 0%, 100% { transform: rotate(0); } 30% { transform: translateY(5px) rotate(-6deg); } 60% { transform: translateY(-2px); } }
.nods .ar { color: var(--gold); font-size: 22px; opacity: .6; }
.nods .road { margin-top: 14px; height: 46px; border-radius: 14px; position: relative; overflow: hidden; border: 1px dashed var(--line); display: grid; place-items: center; font-weight: 900; color: var(--dim); transition: all .6s var(--ease); }
.nods .road.on { color: #24170c; border: 1px solid var(--gold); background: linear-gradient(90deg, var(--copper), var(--gold), var(--gold2)); box-shadow: 0 12px 34px rgba(226,178,96,.35); }

/* formula: fixed phrases + slots, joined with + */
.formula { padding: 14px 12px; display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.formula .lb { text-align: center; font-weight: 800; font-size: 13.5px; color: var(--gold); margin-bottom: 8px; }
.fp { padding: 13px 14px; border-radius: 16px; text-align: center; font-weight: 900; font-size: 17px; line-height: 1.6; transition: all .45s var(--ease); }
.fp.fix { background: linear-gradient(180deg, #4a3522, #33241a); border: 1px solid rgba(226,178,96,.45); }
.fp.slot { border: 2px dashed var(--gold); color: var(--gold2); background: rgba(226,178,96,.06); }
.fp.slot::after { content: "|"; margin-right: 3px; animation: blink 1s steps(1) infinite; color: var(--gold); }
@keyframes blink { 50% { opacity: 0; } }
.fp.ghost, .formula .pl.ghost { opacity: .12; }
.formula .pl { text-align: center; font-family: Lalezar; font-size: 26px; line-height: 1.3; color: var(--gold); transition: opacity .4s; }
.formula .eq { margin-top: 10px; text-align: center; font-weight: 900; color: var(--gold2); }

/* stamp: a forbidden word, stamped */
.stampb { padding: 26px 16px 20px; text-align: center; position: relative; overflow: hidden; }
.stampb .w { font-family: Lalezar; font-size: 92px; line-height: 1.1; color: var(--cream); position: relative; display: inline-block; }
.stampb .w::after { content: ""; position: absolute; left: -10%; right: -10%; top: 54%; height: 7px; border-radius: 4px; background: var(--rust); transform: rotate(-8deg) scaleX(0); transform-origin: right; animation: strikeR .5s .5s var(--ease) forwards; }
@keyframes strikeR { to { transform: rotate(-8deg) scaleX(1); } }
.stampb .tag { position: absolute; top: 18px; left: 18px; padding: 4px 12px; border: 3px solid var(--rust); color: var(--rust); border-radius: 10px; font-weight: 900; font-size: 18px; transform: rotate(-14deg) scale(2.4); opacity: 0; animation: slam .45s .85s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes slam { to { transform: rotate(-14deg) scale(1); opacity: 1; } }
.stampb .s { margin-top: 6px; font-weight: 700; color: var(--muted); }

/* swap: the old phrase is struck out, the new one types in */
.swap { padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.swap .o, .swap .n { padding: 12px 14px; border-radius: 16px; font-weight: 800; font-size: 17px; line-height: 1.6; }
.swap .o { align-self: flex-start; background: rgba(246,237,225,.05); border: 1px solid rgba(224,122,95,.45); position: relative; transition: all .6s var(--ease); }
.swap .o::after { content: ""; position: absolute; right: 10px; left: 10px; top: 52%; height: 3px; background: var(--rust); transform: scaleX(0); transform-origin: right; transition: transform .45s var(--ease); }
.swap .o.x { opacity: .55; } .swap .o.x::after { transform: scaleX(1); }
.swap .ar { text-align: center; color: var(--gold); font-size: 24px; opacity: 0; transition: opacity .4s; } .swap .ar.on { opacity: 1; }
.swap .n { align-self: flex-end; background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #24170c; opacity: 0; transform: translateY(14px) scale(.96); transition: all .6s var(--spring); }
.swap .n.on { opacity: 1; transform: none; }

/* chat header variants + thought bubbles (the prospect's inner voice) */
.phone.mind .hd .av { background: radial-gradient(circle at 30% 25%, #6b5843, #3a2919); color: var(--gold2); }
.phone .av svg { width: 20px; height: 20px; }
.phone.mind .msg.you { background: rgba(246,237,225,.1); color: var(--cream); border: 1px solid rgba(246,237,225,.25); border-radius: 22px; font-style: normal; position: relative; margin-bottom: 8px; }
.phone.mind .msg.you::after { content: ""; position: absolute; left: 14px; bottom: -9px; width: 9px; height: 9px; border-radius: 50%; background: rgba(246,237,225,.1); border: 1px solid rgba(246,237,225,.25); }

/* banned cards */
.cards.ban .card { border-color: rgba(224,122,95,.4); }
.cards.ban .ico { color: var(--rust); background: var(--rust2); border-color: rgba(224,122,95,.35); }
.cards.ban .card .t { position: relative; }
.cards.ban .card .t::after { content: ""; position: absolute; right: -2px; left: -2px; top: 52%; height: 2.5px; background: var(--rust); transform-origin: right; transform: scaleX(0); animation: strike .45s .35s var(--ease) forwards; }
.cards.ban .card.ghost .t::after { animation: none; }

/* quiz feedback */
.chip.ok { background: var(--gold); color: #24170c; border-color: var(--gold); animation: pop .45s var(--spring); }
.chip.bad { background: var(--rust2); border-color: var(--rust); color: var(--rust); animation: shake .45s; }
.why { margin-top: 4px; padding: 10px 12px; border-radius: 14px; background: rgba(226,178,96,.08); border: 1px solid var(--line); font-size: 14px; line-height: 1.8; animation: rise .5s var(--ease) both; }
.why b { color: var(--gold2); }
.preview { margin: 12px 0 4px; padding: 12px 14px; border-radius: 16px; background: linear-gradient(180deg, #4a3522, #3a2919); border: 1px solid rgba(226,178,96,.35); font-weight: 700; line-height: 1.8; }
.preview i { font-style: normal; color: var(--gold2); }

/* ===== motion pro (2026-10-27) — the kit's ad-motion language, gold-on-dark:
   3D entrances, masked word type, icons that draw themselves, a light arc running round the item in focus,
   light sweeps, gold particles, a vertical smear between beats. Everything stays inside #board (never over the narrator). ===== */
@property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
#board > .beat { animation: floaty 6.5s ease-in-out infinite alternate; }
@keyframes floaty { from { translate: 0 -3px; } to { translate: 0 4px; } }
#board > .beat.out { animation: smearOut .34s cubic-bezier(.55, 0, .75, .2) forwards; }
@keyframes smearOut { to { opacity: 0; translate: 0 -30px; scale: 1 1.16; filter: blur(10px); } }
.in { animation: rise3d .8s var(--ease) both; }
@keyframes rise3d { from { opacity: 0; transform: perspective(900px) translateY(26px) rotateX(34deg) scale(.95); filter: blur(10px); } 60% { filter: blur(0); } to { opacity: 1; transform: none; filter: none; } }
/* measuring clone (fitBeat): the final layout, without any motion */
.beat.measure, .beat.measure * { animation: none !important; transition: none !important; transform: none !important; translate: none !important; scale: none !important; rotate: none !important; filter: none !important; }
/* masked word type: each word rises out of a slot */
.mw { display: inline-block; overflow: hidden; vertical-align: bottom; padding: .04em .08em .2em; margin: -.04em -.08em -.2em; }
.mw > span { display: inline-block; transform: translateY(112%) rotate(5deg); animation: mwUp .7s var(--ease) both; }
@keyframes mwUp { to { transform: none; } }
.wipe { clip-path: inset(0 0 0 100%); animation: wipeRL .85s .5s var(--ease) forwards; }
@keyframes wipeRL { to { clip-path: inset(0 0 0 0); } }
/* icons draw themselves when their item arrives */
.beat :is(.ico, .badge, .ic2) svg path { stroke-dasharray: 1 1; stroke-dashoffset: 1; }
.beat .in :is(.ico, .badge, .ic2) svg path, .beat .in.ico svg path, .beat .badge.pop svg path { animation: icoDraw 1s .14s var(--ease) forwards; }
@keyframes icoDraw { to { stroke-dashoffset: 0; } }
/* the item in focus: a light arc runs round its edge */
.gb { position: absolute; inset: 0; border-radius: inherit; padding: 1.7px; pointer-events: none; opacity: 0; transition: opacity .45s; z-index: 2;
  background: conic-gradient(from var(--ang), transparent 0 52%, rgba(244,212,147,.15) 62%, var(--gold2) 80%, #fff 84%, transparent 94%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spinAng 2.6s linear infinite; }
:is(.hi, .on) > .gb { opacity: 1; }
@keyframes spinAng { to { --ang: 360deg; } }
.sweep { position: absolute; inset: 0; pointer-events: none; z-index: 1; background: linear-gradient(105deg, transparent 34%, rgba(244,212,147,.24) 50%, transparent 66%); transform: translateX(120%); opacity: 0; animation: sweepX 1.5s .3s var(--ease) both; }
@keyframes sweepX { from { transform: translateX(120%); opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } to { transform: translateX(-120%); opacity: 0; } }
/* gold particles (always inside a card that clips them) */
.pt { position: absolute; left: var(--x, 50%); top: var(--y, 50%); width: var(--s, 6px); height: var(--s, 6px); border-radius: 50%; background: var(--c, var(--gold2)); box-shadow: 0 0 10px var(--gold);
  pointer-events: none; z-index: 3; animation: ptFly var(--d, 1.1s) cubic-bezier(.2, .7, .3, 1) forwards; }
.pt.sq { border-radius: 2px; box-shadow: none; }
@keyframes ptFly { from { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.25) rotate(var(--r, 0deg)); opacity: 0; } }
/* hero */
.hero .rings i { position: absolute; left: 50%; top: 65px; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 24px; border: 1.5px solid rgba(244,212,147,.6); opacity: 0; animation: ringOut 2.7s .5s var(--ease) infinite; }
.hero .rings i:nth-child(2) { animation-delay: 1.4s; } .hero .rings i:nth-child(3) { animation-delay: 2.3s; }
@keyframes ringOut { 0% { transform: scale(1); opacity: .85; } 100% { transform: scale(2.7) rotate(18deg); opacity: 0; } }
.badge.flip { animation: flip3d 1s var(--spring) both; }
@keyframes flip3d { from { opacity: 0; transform: perspective(600px) rotateY(-200deg) scale(.4); } to { opacity: 1; transform: none; } }
.hero h3, .hero p { position: relative; z-index: 2; }
/* quote: words rise out of their slot on the narrator's word; the punched word gets a gold marker */
.quote .q { display: inline-block; opacity: 1; transform: none; filter: none; overflow: hidden; vertical-align: bottom; padding: .02em .1em .2em; margin: -.02em -.02em -.2em; }
.quote .q > i { display: inline-block; font-style: normal; transform: translateY(115%) rotate(6deg); position: relative; isolation: isolate; }
.quote .q.on { animation: none; }
.quote .q.on > i { animation: mwUp .6s var(--ease) forwards; }
.quote .q.hl { color: #24170c; text-shadow: none; }
.quote .q.hl > i { padding: 0 .16em; }
.quote .q.hl > i::before { content: ""; position: absolute; inset: .18em 0 .04em; z-index: -1; border-radius: .16em; background: linear-gradient(180deg, var(--gold2), var(--gold));
  box-shadow: 0 8px 24px rgba(226,178,96,.35); transform: scaleX(0); transform-origin: 100% 50%; }
.quote .q.hl.on > i::before { animation: boxIn .45s .18s var(--ease) forwards; }
.quote .q.hl.on > i { animation: mwUp .6s var(--ease) forwards, punch .55s .45s var(--spring); }
@keyframes boxIn { to { transform: scaleX(1); } }
/* cards: flip up out of the floor */
.card.in { animation: flipIn .8s var(--ease) both; }
@keyframes flipIn { from { opacity: 0; transform: perspective(800px) rotateX(-72deg) translateY(20px); filter: blur(6px); } 55% { opacity: 1; filter: none; } to { opacity: 1; transform: none; filter: none; } }
.card.hi { transform: none; translate: 0 -3px; scale: 1.025; }
.card .t, .card .s { position: relative; z-index: 2; }
/* chain: steps slide in, links grow down with a travelling spark */
.step { position: relative; overflow: hidden; }
.step.in { animation: slideIn .7s var(--ease) both; }
@keyframes slideIn { from { opacity: 0; transform: translateX(46px) skewX(-7deg); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
.step.hi { transform: none; scale: 1.03; }
.step.hi .ico { animation: icoPulse 1.8s ease-in-out infinite; }
@keyframes icoPulse { 50% { box-shadow: 0 0 0 7px rgba(226,178,96,.12), 0 0 22px rgba(226,178,96,.35); } }
.link::before { transform-origin: 50% 0; transition: transform .55s var(--ease); }
.link.ghost::before { transform: scaleY(0); }
/* versus: the two sides swing in from their own side */
.vs .side { position: relative; overflow: hidden; }
.vs .side.in:first-child { animation: fromR .85s var(--ease) both; }
.vs .side.in:last-child { animation: fromL .85s .1s var(--ease) both; }
@keyframes fromR { from { opacity: 0; transform: perspective(800px) translateX(46px) rotateY(-38deg); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes fromL { from { opacity: 0; transform: perspective(800px) translateX(-46px) rotateY(38deg); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.side.dim { transform: none; scale: .94; }
.side.on { transform: none; scale: 1.04; }
.vs .mid span { animation: popSpin .8s .35s var(--spring) both, glow 2.2s 1.2s ease-in-out infinite; }
@keyframes popSpin { from { opacity: 0; transform: scale(.3) rotate(-180deg); } to { opacity: 1; transform: none; } }
/* stat: a dial of ticks that light up with the count, a glow behind the number, a burst when it lands */
.stat .tk line { stroke: rgba(246,237,225,.16); stroke-width: 2; stroke-linecap: round; transition: stroke .2s; }
.stat .tk line.on { stroke: var(--gold2); }
.stat .glow { position: absolute; left: 50%; top: 113px; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: radial-gradient(circle, rgba(244,212,147,.28), transparent 65%); opacity: 0; transition: opacity .6s; pointer-events: none; }
.stat.done .glow { opacity: 1; animation: breatheGlow 2.4s ease-in-out infinite; }
@keyframes breatheGlow { 50% { transform: scale(1.12); } }
.stat.done .val { animation: valPop .6s var(--spring); }
@keyframes valPop { 40% { scale: 1.16; } }
/* list: rows slide in, their number flips */
.row { position: relative; overflow: hidden; }
.row.in { animation: slideIn .6s var(--ease) both; }
.row.in .n { animation: flipY .7s .12s var(--spring) both; }
@keyframes flipY { from { transform: perspective(300px) rotateY(-180deg); opacity: 0; } to { transform: none; opacity: 1; } }
.row.hi { transform: none; translate: -4px 0; }
.row.hi .n { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #24170c; }
/* chart: the area under leverage fills in after its line is drawn */
.chart .area { opacity: 0; transition: opacity 1.2s .7s; }
.chart .area.on { opacity: 1; }
/* people grid: the 3% ring out */
.dots .p { position: relative; }
.dots .p.g::after { content: ""; position: absolute; inset: -35%; border-radius: 50%; border: 1.5px solid var(--gold2); animation: ringOut 1.9s ease-out infinite; }
/* chess: the board lies on the table in perspective */
.chess .bd { transform: perspective(800px) rotateX(16deg); transform-origin: 50% 100%; animation: boardIn 1s var(--ease) both; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
@keyframes boardIn { from { opacity: 0; transform: perspective(800px) rotateX(68deg) translateY(30px); } to { opacity: 1; transform: perspective(800px) rotateX(16deg); } }
/* chat: bubbles spring from their tail; the other side types first */
.msg { animation: msgIn .55s var(--spring) both; }
.msg.me { transform-origin: 100% 0; } .msg.you { transform-origin: 0 0; } .msg.nt { transform-origin: 50% 50%; }
@keyframes msgIn { from { opacity: 0; transform: scale(.4) translateY(10px); } to { opacity: 1; transform: none; } }
.phone .typing { align-self: flex-end; background: rgba(246,237,225,.92); animation: msgIn .4s var(--spring) both; transform-origin: 0 0; }
.phone .typing i { background: #8a7660; }
.phone .typing.me { align-self: flex-start; background: #3a2919; transform-origin: 100% 0; }
.phone .typing.me i { background: var(--gold); }
/* achievement: rays turn behind the medal, the medal spins in, confetti falls */
.achieve .rays { position: absolute; left: 50%; top: 82px; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(244,212,147,.16) 0 9deg, transparent 9deg 24deg); -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%); mask: radial-gradient(circle, #000 18%, transparent 68%);
  animation: spin 24s linear infinite, fade .9s both; }
.medal { position: relative; z-index: 2; animation: medalIn 1.2s var(--spring) both; }
@keyframes medalIn { from { opacity: 0; transform: perspective(600px) rotateY(-540deg) scale(.3); } to { opacity: 1; transform: none; } }
.achieve h3, .achieve p { position: relative; z-index: 2; }
/* scene title beside the picture-in-picture: it wipes in on every scene change */
#scene .eyebrow { display: inline-block; }
#scene.anim .eyebrow { animation: wipeRL .7s var(--ease) both; }
/* caption: the word being spoken lifts a little */
#cap .w { display: inline-block; transition: opacity .15s, color .15s, transform .28s var(--spring); }
#cap .w.now { transform: translateY(-2px) scale(1.07); }

/* ===== ultra motion for the «هنر گفت‌وگو» beats (2026-10-27) — on top of «motion pro». Everything inside its card. ===== */
#board > .beat.e1 { animation: inSlide .6s var(--ease) both, floaty 6.5s .6s ease-in-out infinite alternate; }
#board > .beat.e2 { animation: inZoom .65s var(--spring) both, floaty 6.5s .65s ease-in-out infinite alternate; }
#board > .beat.e3 { animation: inWipe .75s var(--ease) both, floaty 6.5s .75s ease-in-out infinite alternate; }
/* a light leak crosses the board on every scene change (behind the beat, never over the narrator) */
.leak { position: absolute; inset: -10% -40%; z-index: -1; pointer-events: none; background: radial-gradient(34% 55% at 50% 50%, rgba(244,212,147,.2), transparent 70%); animation: leak 1.7s var(--ease) forwards; }
@keyframes leak { from { transform: translateX(55%); opacity: 0; } 35% { opacity: 1; } to { transform: translateX(-55%); opacity: 0; } }
/* five triggers */
.tq.in { animation: slideIn .6s var(--ease) both; }
.tq.hi { transform: none; translate: -5px 0; }
.trig .gate { position: relative; overflow: hidden; }
.trig .gate.on { animation: gateOn .7s var(--spring); }
.trig .gate.on::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%); transform: translateX(120%); animation: sheen 1.2s .15s var(--ease) both; }
@keyframes gateOn { 40% { scale: 1.06; } }
/* donut: a ring of light turns round it; the slice in focus glows; the value pops when it lands */
.donut .dw::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from var(--ang), transparent 0 70%, rgba(244,212,147,.55) 86%, transparent 96%);
  -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%, #000 70%, transparent 71%); mask: radial-gradient(circle, transparent 66%, #000 67%, #000 70%, transparent 71%); animation: spinAng 3.4s linear infinite; }
.donut .sg.hi { filter: drop-shadow(0 0 7px rgba(244,212,147,.7)); }
.donut .li { position: relative; }
.donut .li.in { animation: slideIn .55s var(--ease) both; }
.donut .cv.pop2 { animation: valPop .55s var(--spring); }
/* four filters: the membranes ripple, the one that stops your words pulses red */
.fl.in { animation: slideIn .6s var(--ease) both; }
.fl::before { animation: membrane 2.6s linear infinite; }
@keyframes membrane { to { background-position: 18px 0; } }
.fl.red { animation: redPulse 1.1s ease-in-out infinite; }
@keyframes redPulse { 50% { box-shadow: 0 0 0 1px var(--rust), 0 0 44px rgba(224,122,95,.55); } }
.filt .bub { box-shadow: 0 0 22px rgba(244,212,147,.25); }
/* the seller alarm: a revolving beacon and a pulsing red edge */
.alarm .siren::before { content: ""; position: absolute; inset: -34px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: conic-gradient(from 0deg, transparent 0 18%, rgba(224,122,95,.42) 26%, transparent 34%, transparent 68%, rgba(224,122,95,.42) 76%, transparent 84%); animation: spin 1.3s linear infinite; }
.alarm.on .siren::before { opacity: 1; }
.alarm.on { animation: alarmEdge 1.2s ease-in-out infinite; }
@keyframes alarmEdge { 50% { box-shadow: 0 0 0 1px var(--rust), 0 0 46px rgba(224,122,95,.35), 0 20px 60px rgba(0,0,0,.45); } }
/* iceberg: light rays and bubbles under water, the ice bobs, the crossings draw themselves */
.berg .ice { animation: bob 4.2s ease-in-out infinite alternate; transform-box: fill-box; }
@keyframes bob { from { transform: translateY(-1.5px); } to { transform: translateY(2.5px); } }
.berg .rays path { animation: rayDrift 7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0; }
.berg .rays path:nth-child(2) { animation-duration: 9s; } .berg .rays path:nth-child(3) { animation-duration: 6s; }
@keyframes rayDrift { from { transform: skewX(-6deg); opacity: .5; } to { transform: skewX(6deg); opacity: 1; } }
.berg .bbl circle { animation: bubble 4.5s linear infinite; transform-box: fill-box; }
@keyframes bubble { from { transform: translateY(0); opacity: 0; } 15% { opacity: .85; } to { transform: translateY(-118px); opacity: 0; } }
.berg .x { opacity: 1; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .55s var(--ease); }
.berg .x.on { stroke-dashoffset: 0; }
.berg .deep.on { filter: drop-shadow(0 0 12px rgba(244,212,147,.35)); }
/* nods */
.nods { position: relative; overflow: hidden; }
.nods .nd.on { animation: pop .6s var(--spring); }
.nods .ar { animation: arPulse 1.4s ease-in-out infinite; }
@keyframes arPulse { 50% { translate: -5px 0; opacity: 1; } }
.nods .road.on { animation: wipeRL .9s var(--ease) both; }
.nods .road { isolation: isolate; }
.nods .road.on::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform: translateX(120%); animation: sheen 1.6s .9s var(--ease) both; }
/* formula: parts flip up, the plus signs spin in, the result glows */
.fp.in { animation: flipIn .8s var(--ease) both; }
.formula .pl { transition: opacity .4s, transform .55s var(--spring); }
.formula .pl.ghost { transform: scale(.4) rotate(-90deg); }
.formula .eq { animation: eqGlow 2.4s ease-in-out infinite; }
@keyframes eqGlow { 50% { text-shadow: 0 0 18px rgba(244,212,147,.7); } }
/* stamp: the word lands out of a blur, the stamp hits with a shake and dust */
.stampb .w { animation: wordIn .7s var(--ease) both; }
@keyframes wordIn { from { opacity: 0; transform: scale(1.35); filter: blur(12px); } to { opacity: 1; transform: none; filter: none; } }
.stampb.hit { animation: shake .42s; }
/* swap: the professional sentence wipes in with a glow */
.swap { position: relative; overflow: hidden; }
.swap .n { opacity: 1; transform: none; clip-path: inset(0 0 0 100%); transition: clip-path .85s var(--ease), box-shadow .6s; }
.swap .n.on { clip-path: inset(0 0 0 0); box-shadow: 0 12px 34px rgba(226,178,96,.35); }
.swap .ar.on { animation: arBounce 1.3s ease-in-out infinite; }
@keyframes arBounce { 50% { translate: 0 5px; } }

/* ===== sheets (ask, map, boot, final) ===== */
.sheet { position: fixed; z-index: 40; inset: var(--below) 0 0 0; display: flex; align-items: flex-end; justify-content: center; animation: fade .35s both; }
@keyframes fade { from { opacity: 0; } }
.sheet .box { width: 100%; max-width: 560px; max-height: 100%; overflow: auto; padding: 20px 18px max(18px, env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0;
  background: linear-gradient(180deg, #2a1e14, #17110c); border: 1px solid var(--line); border-bottom: 0; animation: up .55s var(--ease) both; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { margin: 0 0 4px; font-size: 19px; line-height: 1.6; }
.sheet .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip { padding: 9px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(246,237,225,.05); font-weight: 700; font-size: 14.5px; transition: all .25s; }
.chip.on { background: var(--gold); color: #24170c; border-color: var(--gold); }
textarea, input[type=text], input[type=number], select { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--cream); font: inherit; font-size: 15px; outline: none; }
textarea { min-height: 110px; resize: vertical; }
textarea:focus, input:focus, select:focus { border-color: var(--gold); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
label.f { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 700; }
.acts { display: flex; gap: 10px; justify-content: flex-start; align-items: center; margin-top: 14px; }
.btn { border: 0; border-radius: 14px; padding: 12px 22px; font-weight: 900; background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #24170c; }
.btn[disabled] { opacity: .4; }
.scd { margin-inline-start: auto; position: relative; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); overflow: hidden; }
.scd b { font-family: Lalezar, Vazirmatn; font-weight: 400; font-size: 17px; color: var(--gold2); position: relative; z-index: 1; }
.scd i { position: absolute; inset: auto 0 0 0; height: 100%; background: rgba(226,178,96,.16); transform-origin: right; transform: scaleX(0); transition: transform 1s linear; }
.lnk { border: 0; background: none; color: var(--muted); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
.names input { padding: 9px 11px; font-size: 14px; }
.meter { height: 8px; border-radius: 8px; background: rgba(246,237,225,.1); overflow: hidden; margin: 6px 0 2px; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width .4s var(--ease); }
.game .bd { display: grid; grid-template-columns: repeat(8, 1fr); width: min(100%, 340px); margin: 10px auto; direction: ltr; border-radius: 10px; overflow: hidden; border: 2px solid rgba(226,178,96,.5); }
.game .sq { aspect-ratio: 1; border: 0; padding: 0; display: grid; place-items: center; font-weight: 900; }
.game .sq.l { background: #d9c3a0; } .game .sq.d { background: #7a5535; }
.game .sq.x { background: #2a1e14 !important; color: #6b5843; } .game .sq.win { background: radial-gradient(circle, var(--gold2), var(--gold)) !important; color: #24170c; animation: pop .5s var(--spring); }

/* boot & map */
.screen { position: fixed; z-index: 45; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 22px max(26px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(15,11,8,0) 0%, rgba(15,11,8,.35) 40%, rgba(15,11,8,.96) 78%); animation: fade .5s both; }
.screen .kick { color: var(--gold); font-weight: 800; letter-spacing: .5px; }
.screen h1 { margin: 2px 0 6px; font-family: Lalezar; font-weight: 400; font-size: min(42px, 10.2vw); line-height: 1.15; color: var(--gold2); }
.screen p { margin: 0 0 18px; color: var(--cream); max-width: 460px; }
.map { position: fixed; z-index: 46; inset: 0; overflow: auto; padding: 70px 16px 30px; background: rgba(12,9,6,.97); animation: fade .3s both; }
.map h2 { margin: 0 0 12px; font-family: Lalezar; font-weight: 400; font-size: 30px; color: var(--gold2); }
.chap { padding: 14px; margin-bottom: 10px; }
.chap .hh { display: flex; align-items: center; gap: 12px; }
.chap .k { font-size: 12px; color: var(--gold); font-weight: 800; } .chap .tt { font-weight: 900; font-size: 17px; line-height: 1.4; }
.chap .bar { height: 5px; border-radius: 5px; background: rgba(246,237,225,.1); margin-top: 10px; overflow: hidden; } .chap .bar i { display: block; height: 100%; background: var(--gold); }
.chap .sc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chap .sc button { border: 1px solid var(--line); background: rgba(246,237,225,.04); border-radius: 10px; font-size: 12.5px; padding: 5px 9px; text-align: right; }
.chap .sc button.done { border-color: rgba(226,178,96,.6); color: var(--gold2); }
.final { position: fixed; z-index: 46; inset: 0; overflow: auto; padding: 30px 18px 40px; background: radial-gradient(120% 70% at 50% 0%, #3a2918, var(--bg) 70%); animation: fade .5s both; }
.final h1 { font-family: Lalezar; font-weight: 400; font-size: 40px; color: var(--gold2); margin: 0; line-height: 1.3; }
.final .item { padding: 14px; margin: 10px 0; } .final .item .k { color: var(--gold); font-size: 12.5px; font-weight: 800; } .final .item .v { font-weight: 700; white-space: pre-wrap; }

/* ===== wide screens: the film in the middle; when he waits he moves aside and the question opens beside him ===== */
@media (min-aspect-ratio: 1/1) {
  :root { --top: 60px; --bottom: 76px; --dock: calc(5vw + var(--fw)); }
  #amb { display: block; }
  #pres { -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
  body.show #pres { right: 3vw; }
  #board { inset: var(--top) var(--dock) var(--bottom) 3vw; }
  #board > .beat { max-width: 560px; }
  #ctl { background: none; }
  .sheet { align-items: center; inset: var(--top) var(--dock) var(--bottom) 0; }
  .sheet .box { border-radius: 26px; border-bottom: 1px solid var(--line); max-height: 100%; }
  .screen { padding-left: 8vw; padding-right: var(--dock); justify-content: center; background: linear-gradient(90deg, rgba(15,11,8,.96) 40%, rgba(15,11,8,.2)); }
}
/* a phone on its side: the buttons beside the film, never over its caption */
@media (min-aspect-ratio: 1/1) and (max-height: 500px) {
  :root { --top: 46px; }
  #ctl { top: var(--top); right: auto; left: 0; bottom: 0; height: auto; width: calc(50vw - var(--fw) / 2); padding: 0 8px; flex-wrap: wrap; align-content: center; gap: 8px; }
  body.show #ctl { display: none; }
  .sheet { inset: var(--top) var(--dock) 0 0; }
  .sheet .box { padding: 12px 14px; }
}

/* ===== «کارگاه هدف» beats (2026-10-30) ===== */
/* story clip */
.clip { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.clip .fr { position: relative; width: 216px; aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; background: #000 center / cover;
  box-shadow: 0 0 0 1.5px rgba(226,178,96,.55), 0 24px 70px rgba(0,0,0,.65); animation: clipIn .9s var(--ease) both; }
@keyframes clipIn { from { opacity: 0; transform: scale(.92); filter: blur(10px) brightness(.4); } }
.clip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.clip .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 42%, transparent 58%, rgba(0,0,0,.55)); }
.clip .cap2 { max-width: 330px; min-height: 1.7em; text-align: center; font-weight: 800; font-size: 17px; line-height: 1.7; text-shadow: 0 2px 14px rgba(0,0,0,.9); }
/* four colours */
.tipo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tp { padding: 14px 10px 12px; text-align: center; position: relative; overflow: hidden; border-color: rgba(var(--c), .4); transition: transform .45s var(--spring), opacity .4s, box-shadow .4s, filter .4s; }
.tp .orb { width: 50px; height: 50px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; color: #1a120b;
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.7), rgb(var(--c)) 58%); box-shadow: 0 0 26px rgba(var(--c), .5); }
.tp .orb svg { width: 26px; height: 26px; }
.tp .t { font-family: Lalezar, Vazirmatn; font-size: 27px; line-height: 1.2; color: rgb(var(--c)); }
.tp .s { font-size: 13px; color: var(--muted); font-weight: 700; line-height: 1.6; }
.tp .kw { display: none; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 8px; }
.tp .kw span { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 99px; background: rgba(var(--c), .2); border: 1px solid rgba(var(--c), .45); animation: pop .45s var(--spring) both; }
.tp.kwon .kw { display: flex; }
.tp.ghost { opacity: .14; }
.tipo.focus .tp:not(.hi):not(.ghost) { opacity: .38; transform: scale(.95); filter: saturate(.35); }
.tp.hi { box-shadow: 0 0 0 1.5px rgb(var(--c)), 0 16px 44px rgba(var(--c), .3); transform: scale(1.03); }
/* values */
.vals { padding: 18px 16px 14px; text-align: center; position: relative; overflow: hidden; }
.vals .vn { color: var(--muted); font-weight: 700; font-size: 13px; } .vals .vn b { font-family: Lalezar; font-weight: 400; font-size: 30px; color: var(--gold2); margin-left: 6px; vertical-align: -4px; }
.vals .badge { margin: 6px auto 10px; }
.vals .t { font-family: Lalezar, Vazirmatn; font-size: 38px; line-height: 1.25; color: var(--gold2); }
.vals .s { font-weight: 700; margin-top: 2px; }
.vals .nt:not(:empty) { display: flex; gap: 8px; align-items: flex-start; text-align: right; margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(226,178,96,.08);
  border: 1px solid var(--line); font-weight: 700; font-size: 14.5px; line-height: 1.8; animation: rise .5s var(--ease) both; }
.vals .nt svg { width: 20px; height: 20px; flex: none; margin-top: 3px; color: var(--gold); }
.vals .nt.w { background: var(--rust2); border-color: rgba(224,122,95,.5); } .vals .nt.w svg { color: var(--rust); }
.vals .d14 { display: flex; gap: 4px; justify-content: center; margin-top: 14px; }
.vals .d14 i { width: 12px; height: 4px; border-radius: 3px; background: rgba(246,237,225,.16); transition: all .4s; }
.vals .d14 i.on { background: var(--gold); } .vals .d14 i.cur { width: 24px; background: var(--gold2); box-shadow: 0 0 8px var(--gold); }
.vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 12px; }
.vgrid .vc { display: flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 12px; background: rgba(246,237,225,.05); border: 1px solid var(--line);
  font-weight: 800; font-size: 13.5px; line-height: 1.4; opacity: 0; animation: pop .45s var(--spring) forwards; }
.vgrid .vc b { font-family: Lalezar; font-weight: 400; color: var(--gold2); font-size: 17px; min-width: 18px; text-align: center; }
.vgrid .vc svg { width: 16px; height: 16px; flex: none; color: var(--gold); }
/* circuits */

/* ---------- player ---------- */
const nextB = $('#next'), segs = $('#segs');
let waitNext = null;
function chapterGroups(ch) { return G.filter(g => g.ch === ch); }
function paintSegs(gi, frac) {
  const g = G[gi], list = chapterGroups(g.ch);
  if (segs.dataset.ch !== String(g.ch)) { segs.dataset.ch = g.ch; segs.innerHTML = list.map(() => '<i></i>').join(''); }
  [...segs.children].forEach((s, i) => { const k = GI[list[i].id]; s.style.setProperty('--p', k < gi ? 1 : k === gi ? frac : 0); });
}
/* the film carries its own music; the warm bed only plays while he waits (three beds for six chapters) */
let bedT = 0;
const bedN = ch => (ch - 1) % 3 + 1;
function bedOn(ch) {
  if (!DATA.music) return;
  clearTimeout(bedT);
  const src = `media/music/bed${bedN(ch)}.mp3`;
  if (!music.src.endsWith(src)) music.src = src;
  music.play().catch(() => {}); setMusic(BED);
}
function bedOff() { if (!DATA.music) return; setMusic(0); clearTimeout(bedT); bedT = setTimeout(() => music.pause(), 450); }
/* the film stops: he stands and waits, alive, and the question opens below him; behind him the next part is already loading */
let holdT = 0;
function hold(nx) {
  film.pause(); setMode('show'); stand(); bedOn(G[S.pos].ch);
  clearTimeout(holdT);
  if (nx) holdT = setTimeout(() => loadRun(SC[nx.id].r), 450);
}
function resume() { clearTimeout(holdT); if (document.body.classList.contains('show')) bedOff(); setMode('talk'); showBeat(null); }
const wait = ms => new Promise(r => setTimeout(r, ms));
let flowing = false;  // the next scene follows in the same part: the film is already there, no seek
async function runGroup(gi) {
  const my = ++seq, g = G[gi], cont = flowing; flowing = false; S.pos = gi; save();
  resume(); paintSegs(gi, 0);
  await playScene(g, gi, cont);
  if (my !== seq) return;
  paintSegs(gi, 1);
  S.done[g.id] = 1; save();
  const nx = G[gi + 1];
  if (!nx || SC[nx.id].r !== SC[g.id].r) {  // inside one part the film simply plays on
    hold(nx);
    await ask(g.id);
    if (my !== seq) return;
    if (!nx || nx.ch !== g.ch) { showBeat({c: 'achieve', ch: g.ch}); await wait(3800); if (my !== seq) return; }
  }
  if (!nx) { finale(); return; }
  flowing = SC[nx.id].r === SC[g.id].r;
  runGroup(gi + 1);
}
function go(gi) { seq++; halt(); paused = false; setPP(); $('#pp').classList.remove('wait'); noteEl.classList.remove('on'); document.querySelectorAll('.sheet').forEach(x => x.remove());  // a question left open (map, ‹ ›, ↻) must not cover the next scene
  runGroup(Math.max(0, Math.min(G.length - 1, gi))); }
nextB.onclick = () => { sfx('tap', .25); go(S.pos + 1); };
$('#prev').onclick = () => { sfx('tap', .25); go(S.pos - 1); };
$('#again').onclick = () => { sfx('tap', .25); go(S.pos); };
function setPP() { $('#pp').innerHTML = svg(paused ? 'play' : 'pause'); }
$('#pp').onclick = () => {
  paused = !paused; setPP(); $('#pp').classList.remove('wait'); noteEl.classList.remove('on');
  if (!curStop) return;
  if (paused) film.pause(); else if (film.error) { netTry = 0; reload(); } else play();
};
const SPEEDS = [1.1, 1.25, 1.4, 1];
$('#speed').onclick = () => { rate = SPEEDS[(SPEEDS.indexOf(rate) + 1) % SPEEDS.length]; $('#speed').textContent = fa(rate).replace('.', '٫') + '×'; film.defaultPlaybackRate = rate; film.playbackRate = rate; };
function setMute() { $('#mute').innerHTML = svg(muted ? 'muted' : 'sound'); }
$('#mute').onclick = () => { muted = !muted; setMute(); music.muted = muted; setMusic(musicT); film.muted = muted; };

$('#prev').innerHTML = svg('back'); $('#again').innerHTML = svg('redo'); $('#mapb').innerHTML = svg('grid'); nextB.insertAdjacentHTML('beforeend', svg('fwd')); setPP(); setMute();
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,select')) return; if (e.key === ' ') { e.preventDefault(); $('#pp').click(); } if (e.key === 'ArrowLeft') nextB.click(); if (e.key === 'ArrowRight') $('#prev').click(); });

/* ---------- journey map ---------- */
$('#mapb').onclick = () => {
  const was = paused; if (curStop && !paused) { paused = true; film.pause(); setPP(); }
  const m = document.createElement('div'); m.className = 'map';
  const secs = DATA.chapters.map((c, i) => ({n: i + 1, title: c.title, sub: c.sub}));
  m.innerHTML = `<button class="ib" type="button" style="position:fixed;top:14px;left:14px" data-x>${svg('x')}</button><h2>نقشه‌ی سفر</h2>` + secs.map(c => {
    const gs = G.filter(g => g.ch === c.n), d = gs.filter(g => S.done[g.id]).length;
    return `<div class="chap glass"><div class="hh"><div class="ico">${svg(['flag', 'alert', 'compass', 'gear', 'scale', 'zap', 'pen'][c.n])}</div><div><div class="k">فصل ${fa(c.n)}</div><div class="tt">${esc(c.title)}</div><div class="hint" style="margin:0">${esc(c.sub || '')}</div></div></div>
      <div class="bar"><i style="width:${Math.round(d / gs.length * 100)}%"></i></div><div class="sc">${gs.map(g => `<button type="button" class="${S.done[g.id] ? 'done' : ''}" data-g="${GI[g.id]}">${esc(g.title)}</button>`).join('')}</div></div>`;
  }).join('');
  document.body.appendChild(m);
  m.querySelector('[data-x]').onclick = () => { m.remove(); if (curStop && !was) { paused = false; setPP(); play(); } };
  m.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { m.remove(); go(+b.dataset.g); });
};

/* ---------- finale: «قراردادِ هدفِ من» (everything the learner wrote on the way, signed and dated) ---------- */
function finale() {
  const A = S.ans, f = document.createElement('div'); f.className = 'final';
  const sm = A.smart || {}, col = A.color, vs = A.vals || [], sy = A.sys || {}, rv = A.review || {};
  const num = (arr) => arr.map((x, i) => `${fa(i + 1)}. ${x}`).join('\n');
  const rows = [['هدفِ من', sm.text || (A.goal0 || {}).t], ['دلیل‌های عمیقِ من', num(A.reasons || [])],
    ['رنگِ موتورِ من', col ? `${col.t}؛ ${col.s}` : ''], ['سه ارزشِ اولِ من', num(vs.map(v => v.v + (v.e ? ` (${v.e})` : '')))],
    ['تعهدِ من', (sy.commit || []).join('، ')], ['بهایی که می‌پردازم', (sy.price || []).join('، ')], ['عادتِ کوچکِ هر روزم', (sy.habit || []).join('، ')],
    ['از انزجار به خواسته', (A.pairs || []).filter(p => p.a && p.g).map(p => `${p.a} ← ${p.g}`).join('\n')],
    ['همین امروز', A.now], ['هر روز، یک ذره بیشتر', A.more],
    ['بازبینیِ هفتگی', rv.day ? `${rv.day}، ${rv.time || ''}؛ هر ماه هم‌راستایی با ارزش‌ها و شخصیتم را چک می‌کنم و هر نود روز هدفم را به‌روز می‌کنم.` : '']].filter(r => r[1]);
  const q = A.quiz || {}, qn = Object.keys(q).length, qok = Object.values(q).filter(Boolean).length;
  let date = ''; try { date = new Date().toLocaleDateString('fa-IR', {year: 'numeric', month: 'long', day: 'numeric'}); } catch (e) {}
  f.innerHTML = `<div class="medal" style="margin:10px auto 14px">${svg('pen', 2)}</div><h1>قراردادِ هدفِ من</h1>
    <p>${qn ? `در تمرین‌ها ${fa(qok)} از ${fa(qn)} جواب درست دادی. ` : ''}این قرارداد را خودت نوشتی. هر هفته در روزِ بازبینی‌ات یک بار بخوانش.</p>
    ${rows.map(([k, v]) => `<div class="item glass"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('') || '<div class="item glass"><div class="v">هنوز چیزی ننوشته‌ای. از نقشه‌ی سفر برگرد و تمرین‌ها را پر کن.</div></div>'}
    <div class="item glass"><div class="k">یادت بماند</div><div class="v">هدفِ بزرگ جهت می‌دهد، عادتِ کوچک حرکت می‌دهد. شروعِ کوچک، ولی غیرقابلِ مذاکره.</div></div>
    <div class="sign glass"><div><div class="k">امضا</div><div class="nm">${esc(rv.name || '')}</div></div><div><div class="k">تاریخ</div><div class="dt">${esc(date)}</div></div></div>
    <div class="acts" style="justify-content:center"><button class="btn" type="button" data-c>کپی متن قرارداد</button>${navigator.share ? '<button class="btn" type="button" data-s>فرستادن</button>' : ''}<button class="lnk" type="button" data-p>چاپ / PDF</button><button class="lnk" type="button" data-m>نقشه‌ی سفر</button></div>`;
  document.body.appendChild(f); sfx('ding', .45); confetti(f, 30);
  const text = () => ['قراردادِ هدفِ من', ...rows.map(([k, v]) => `${k}:\n${v}`), rv.name ? `امضا: ${rv.name}` : '', date].filter(Boolean).join('\n\n');
  f.querySelector('[data-c]').onclick = e => { (navigator.clipboard ? navigator.clipboard.writeText(text()) : Promise.reject()).then(() => { e.target.textContent = 'کپی شد ✓'; }).catch(() => { e.target.textContent = 'کپی نشد'; }); };
  const sh = f.querySelector('[data-s]'); if (sh) sh.onclick = () => navigator.share({title: 'قراردادِ هدفِ من', text: text()}).catch(() => {});
  f.querySelector('[data-p]').onclick = () => window.print();
  f.querySelector('[data-m]').onclick = () => { f.remove(); $('#mapb').click(); };
}


/* ---------- gold dust (slow, sparse, behind the board) ---------- */
(() => {
  if (!matchMedia('(min-aspect-ratio: 1/1)').matches) return;  // on a phone the film covers it
  const c = $('#dust'), x = c.getContext('2d'); let W, H; const N = 46, ps = [];
  const fit = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; };
  fit(); addEventListener('resize', fit);
  for (let i = 0; i < N; i++) ps.push({x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.8, v: .00012 + Math.random() * .0004, a: Math.random() * 6.28});
  const tick = () => { x.clearRect(0, 0, W, H);
    for (const p of ps) { p.y -= p.v; p.a += .01; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      const px = (p.x + Math.sin(p.a) * .01) * W, py = p.y * H, al = .25 + .35 * Math.sin(p.a * 1.7) ** 2;
      x.beginPath(); x.arc(px, py, p.r * devicePixelRatio, 0, 6.28); x.fillStyle = `rgba(244,212,147,${al})`; x.fill(); }
    requestAnimationFrame(tick); };
  tick();
})();


/* ---------- reel gestures (almost every viewer is on a phone): swipe ← next, swipe → previous, tap the narrator = pause ---------- */
(() => {
  let x0 = 0, y0 = 0, t0 = 0;
  const stage = $('#stage');
  stage.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, {passive: true});
  stage.addEventListener('touchend', e => {
    if (e.target.closest('button,input,textarea,select,.sheet,.map,.final,.screen')) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 700) { dx < 0 ? nextB.click() : $('#prev').click(); return; }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 350 && e.target.closest('#pres')) $('#pp').click();
  }, {passive: true});
  $('#pres').addEventListener('click', e => { if (!('ontouchstart' in window)) $('#pp').click(); });
})();

/* ---------- boot ---------- */
function boot() {
  const resumable = S && S.pos > 0;
  const b = document.createElement('div'); b.className = 'screen'; document.body.classList.add('boot');
  b.innerHTML = `<div class="kick">کارگاه تعاملی · مربی روبه‌روی تو</div><h1>کارگاهِ هدف<br>فانوسِ خودت را پیدا کن</h1>
    <p>شش فصل: چرا هدف‌ها خاموش می‌شوند، فانوسِ خودت، موتورِ شخصیتت، قانون‌های هدف، سه نکته‌ی طلایی و یک کارگاهِ عملی. وسط راه تمرین می‌کنی و آخرش «قراردادِ هدفِ خودت» را امضا می‌کنی. صدای دستگاهت را روشن کن.</p>
    <div class="acts">${resumable ? '<button class="btn" type="button" data-c>ادامه از همان‌جا</button><button class="lnk" type="button" data-n>از اول</button>' : '<button class="btn" type="button" data-n>شروع</button>'}</div>`;
  document.body.appendChild(b);
  const start = pos => { b.remove(); document.body.classList.remove('boot'); if (DATA.music) { music.src = `media/music/bed${bedN(G[pos].ch)}.mp3`; audioInit(); music.play().catch(() => {}); setMusic(0); }
    go(pos); };
  b.querySelector('[data-n]').onclick = () => { S = fresh(); save(); start(0); };
  if (resumable) b.querySelector('[data-c]').onclick = () => start(S.pos);
}
if (!S) S = fresh();
/* preview without playing: #demo=ask:<group> · #demo=medal:<chapter> · #demo=final (sample answers, nothing saved) */
const DEMO = decodeURIComponent((location.hash.match(/^#demo=(.+)$/) || [])[1] || '');
if (!DEMO) { loadRun(SC[G[S.pos || 0].id].r); boot(); }
else {
  const [k, g] = DEMO.split(':'); paused = true; S = fresh();  // in memory only: nothing here calls save()
  idleV.play().catch(() => {});
  if (k === 'ask') ask(g);
  else if (k === 'medal') showBeat({c: 'achieve', ch: +g});
  else if (k === 'final') { S.ans = {smart: {text: 'تا آخرِ اسفندِ ۱۴۰۷، درآمدِ ماهانه‌ی پایدارم را به ۱۵۰ میلیون تومان می‌رسانم.'}, reasons: ['پدرم دیگر نگرانِ آینده‌اش نباشد', 'کنارِ بچه‌هایم باشم', 'الگوی واقعیِ تیمم شوم'],
    color: {t: 'زرد', s: 'یاری‌رسان و حامی'}, vals: [{v: 'خانواده'}, {v: 'امنیتِ مالی'}, {v: 'رشدِ فردی'}], sys: {commit: ['روزی ۵ تماسِ مؤثر'], price: ['تفریحِ کوتاه‌مدتِ کمتر'], habit: ['هر روز قبل از ساعتِ ۹ صبح، ۳ تماسِ هدفمند']},
    review: {day: 'جمعه', time: 'صبح', name: 'امیر میرزایی'}}; finale(); }
}
</script>
